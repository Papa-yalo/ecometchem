<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EkoMetChem — Админка</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
</head>
<body>
  <a href="/admin/refresh.html" style="position:fixed;right:16px;bottom:16px;z-index:99999;padding:12px 18px;border-radius:10px;background:#143b2b;color:white;font:15px system-ui;text-decoration:none">Актуализация офферов</a>
  <!-- Netlify Identity + Git Gateway based CMS. See README.md "Админка" section
       for one-time setup steps (Identity, Git Gateway, inviting users). -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
